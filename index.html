<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#040810">
  <title>Gentle AI × Engram — Binary Memory Field</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="Gentle AI and Engram animated concept">
    <img class="hero-poster" src="assets/poster.jpg" alt="Binary rose and elephant connected in the Gentle AI and Engram animation">
    <canvas id="field" width="1920" height="1080" role="img" aria-label="A field of binary characters reconstructs the Gentle AI rose and Engram elephant across a thirty second story"></canvas>
    <div class="fallback" aria-hidden="true"><strong>GENTLE AI × ENGRAM</strong><span>Build with purpose. Remember what matters.</span></div>
    <a class="preview-link" href="assets/preview-mobile.mp4" aria-label="Watch the 30-second video preview">Watch video ↗</a>
    <nav class="controls" aria-label="Animation controls">
      <button id="replay" type="button" aria-label="Replay animation" title="Replay">↺</button>
      <button id="toggle" type="button" aria-label="Pause animation" title="Pause">Ⅱ</button>
      <button id="skip" type="button" aria-label="Go to final scene" title="Final scene">↣</button>
      <button id="sound" type="button" aria-label="Enable sound" title="Sound">♪</button>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
